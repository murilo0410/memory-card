<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da memória</title>
</head>
<!-- Link para o arquivo de estilização do CSS -->
<link rel="stylesheet" href="css/styles.css">

<body>   
  <section class="header">
    <h1>Jogo da memória</h1>
    <button id="start">Iniciar</button>
    <span id="timer">00:00</span>  
  </section>

  <!-- Início do container principal -->
  <section class="memory-game">    
  
    <!-- Início das seções dos cards - 12 cards (cartões)-->
    <section class="memory-card" data-framework="guido">
      <!-- O que são Data Attributes?
        São atributos criados por você no HTML para guardar informações extras em uma tag 
        sem precisar criar classes ou IDs.Exemplo no HTML:<div data-status="ativo" 
        data-cor="azul">Texto</div>-->
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/Guido.png" alt="Guido" />
    </section>

    <section class="memory-card" data-framework="Mate">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/Mate.png" alt="Mate" />
    </section>

    <section class="memory-card" data-framework="sally">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/sally.jpg" alt="Sally" />
    </section>

    <section class="memory-card" data-framework="lizzie">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/vv.jpg" alt="Lizzie" />
    </section>

    <section class="memory-card" data-framework="McQueen">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/relampago-mcqueen.png" alt="McQueen" />
    </section>

    <section class="memory-card" data-framework="strip weathers">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/rei.jpg" alt="Strip Weathers" />
    </section>

    <section class="memory-card" data-framework="strip weathers">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/rei.jpg" alt="Strip Weathers" />
    </section>

    <section class="memory-card" data-framework="sally">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/sally.jpg" alt="Sally" />
    </section>

    <section class="memory-card" data-framework="lizzie">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/vv.jpg" alt="Lizzie" />
    </section>

    <section class="memory-card" data-framework="Mate">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/Mate.png" alt="Mate" />
    </section>

    <section class="memory-card" data-framework="McQueen">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/relampago-mcqueen.png" alt="McQueen" />
    </section>

    <section class="memory-card" data-framework="Guido">
      <img class="front-face" src="img/logo.jpg" alt="cars" />
      <img class="back-face" src="img/Guido.png" alt="Guido" />
    </section>
    <!-- Fim das seções dos cards-->

  </section>
  <!-- Fim do container principal -->

  <!-- Link para o arquivo Javascript, que será iniciado na próxima semana -->
  <script src="js/scripts.js"></script>
</body>
</html>
